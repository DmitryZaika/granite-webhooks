[package]
name = "webhooks-email"
version = "0.1.0"
edition = "2024"
description = "Inbound email from SES and the emails employees send."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See webhooks-core's `test-support`.
test-support = ["webhooks-core/test-support"]

[dependencies]
webhooks-core = { path = "../core" }
common = { path = "../../../common", features = ["images"] }
axum = "0.8"
bytes = "1.11"
email_reply_parser = "0.1"
lambda_http = "1.1"
mail-builder = "1.0.0"
mail-parser = "0.11"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
urlencoding = "2.1.3"
uuid = "1.23"

[dev-dependencies]
webhooks-core = { path = "../core", features = ["test-support"] }
test-db = { path = "../../../test-db" }
axum-test = "19"
