[package]
name = "webhooks-phone"
version = "0.1.0"
edition = "2024"
description = "CloudTalk, RingCentral and Telnyx webhooks, the CRM contact sync with them, texts employees send and Google address lookups."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See webhooks-core's `test-support`.
test-support = ["webhooks-core/test-support"]

[dependencies]
webhooks-core = { path = "../core" }
common = { path = "../../../common" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
lambda_http = "1.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
urlencoding = "2.1.3"
uuid = "1.23"

[dev-dependencies]
webhooks-core = { path = "../core", features = ["test-support"] }
test-db = { path = "../../../test-db" }
axum-test = "19"
tracing-test = "0.2.6"
