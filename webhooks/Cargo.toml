[package]
name = "webhooks"
version = "0.1.0"
edition = "2024"

# The modules are the library; main.rs only starts the Lambda, so a new
# `GIT_SHA` (read there) rebuilds the binary alone.
[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# Generates the OpenAPI document of the lead form route with utoipa, for
# `make webhooks-openapi` and its test (`--features openapi`). Builds without
# it serve the checked-in webhooks/openapi.json.
openapi = ["dep:utoipa"]

[dependencies]
common = { path = "../common" }
utoipa = { version = "5.5.0", features = ["axum_extras"], optional = true }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
lambda_http = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }

http-body-util = "0.1"
rand = "0.10"
# rustls without aws-lc-rs (a C build); `common::http` clients run on ring.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider"] }
sha2 = "0.11"
uuid = "1.23"
mail-parser = "0.11"
bytes = "1.11"
email_reply_parser = "0.1"
thiserror = "2.0"
base64 = "0.22"
regex = "1"
urlencoding = "2.1.3"
serde_urlencoded = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
mail-builder = "1.0.0"

[dev-dependencies]
test-db = { path = "../test-db" }
axum-test = "19"
dotenvy = "0.15"
tracing-test = "0.2.6"
