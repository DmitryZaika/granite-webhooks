[package]
name = "webhooks"
version = "0.1.0"
edition = "2024"

# The routes of the crates in crates/ (see src/lib.rs); main.rs only starts
# the Lambda, so a new `GIT_SHA` (read there) rebuilds the binary alone.
[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[[bin]]
name = "webhooks"
path = "src/main.rs"
test = false

[features]
# Generates the OpenAPI document of the lead form route with utoipa, for
# `make webhooks-openapi` and its test (`--features openapi`). Builds without
# it serve the checked-in webhooks/openapi.json.
openapi = ["dep:utoipa", "webhooks-core/openapi", "webhooks-leads/openapi"]

[dependencies]
webhooks-core = { path = "crates/core" }
webhooks-email = { path = "crates/email" }
webhooks-leads = { path = "crates/leads" }
webhooks-phone = { path = "crates/phone" }
common = { path = "../common" }
axum = "0.8"
lambda_http = "1.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5.5.0", features = ["axum_extras"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1.0"
