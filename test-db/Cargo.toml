[package]
name = "test-db"
version = "0.1.0"
edition = "2024"
description = "Fast per-test MySQL databases: migrations and seed run once into a template, each test copies it."

[dependencies]
test-db-macros = { path = "macros" }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "migrate"] }
tokio = { version = "1", features = ["sync"] }
sha2 = "0.11"
