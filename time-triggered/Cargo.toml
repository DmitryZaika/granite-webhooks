[package]
name = "time-triggered"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }

sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
lambda_runtime = "1.0.1"
serde = "1"
tokio = { version = "1", features = ["macros"] }
serde_json = "1.0"
# rustls without aws-lc-rs (a C build); `common::http` clients run on ring.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[dev-dependencies]
test-db = { path = "../test-db" }
