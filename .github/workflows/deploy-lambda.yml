name: Deploy Lambda

# Builds one app's Rust binary from the branch picked in "Use workflow from"
# and uploads it as the code of that app's Lambda(s). Only the code changes:
# environment variables and other configuration set on the Lambda are kept.
# Prod gets a release build; dev, which is only tried out, a debug build, done
# in a fraction of the time (see Build).
# With "Deploy" unchecked it only builds: the zip is kept as the run's
# artifact and AWS is never called.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (dev is a debug build, prod a release build)
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      project:
        description: Project
        type: choice
        required: true
        options:
          - api
          - webhooks
          - time-triggered
      deploy:
        description: Deploy (unchecked only builds the zip)
        type: boolean
        default: true

concurrency:
  # A build-only run never waits behind (or holds up) a deploy.
  group: ${{ inputs.deploy && format('deploy-{0}-{1}', inputs.project, inputs.environment) || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  # Assumed through GitHub OIDC; its trust policy accepts runs from any branch
  # of this repository (never forks).
  AWS_ROLE_ARN: arn:aws:iam::741448943665:role/github-actions-lambda-deploy
  CARGO_TERM_COLOR: always
  # Pinned so the zig linker wrapper, whose path cargo-zigbuild passes to rustc,
  # stays the same between runs: a new path invalidates every cached crate.
  # Bumping either version rebuilds the dependency cache once.
  CARGO_LAMBDA_VERSION: 1.9.2
  ZIGLANG_VERSION: 0.17.0

jobs:
  deploy:
    name: ${{ inputs.project }} → ${{ inputs.deploy && inputs.environment || format('{0} build only', inputs.environment) }} (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP: ${{ inputs.project }}
      DEPLOY_ENV: ${{ inputs.environment }}
      BRANCH: ${{ github.ref_name }}
    steps:
      # sqlx's query! macros check every query against this schema at compile
      # time. .cargo/config.toml pins DATABASE_URL to 127.0.0.1:3307/granite_local.
      # Started in the background (not as a service container) so pulling and
      # initializing MySQL overlaps with the setup steps below.
      - name: Start build database
        run: |
          docker run -d --name mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=granite -e MYSQL_DATABASE=granite_local \
            mysql:8.0


      # The Lambdas of each app in each environment, as in the Makefile.
      - name: Resolve Lambda functions
        run: |
          case "$APP/$DEPLOY_ENV" in
            api/prod)            functions="granite-api granite-api-stream" ;;
            api/dev)             functions="granite-api-dev granite-api-stream-dev" ;;
            webhooks/prod)       functions="granite-webhooks" ;;
            webhooks/dev)        functions="granite-webhooks-dev" ;;
            time-triggered/prod) functions="time-triggered" ;;
            time-triggered/dev)  functions="time-triggered-dev" ;;
            *) echo "::error::$APP has no $DEPLOY_ENV Lambda"; exit 1 ;;
          esac
          echo "FUNCTIONS=$functions" >> "$GITHUB_ENV"
          echo "Deploying $APP to: $functions"

      - uses: actions/checkout@v4

      - name: Record commit
        run: |
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='Building %h %s (%an, %ad)'

      - uses: dtolnay/rust-toolchain@stable

      # One cache per build profile, prod's under its old name. rust-cache only
      # saves when its key missed, so with one key for both, the profile that
      # did not save it would build every dependency from scratch on each run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lambda-${{ inputs.project }}${{ inputs.environment == 'dev' && '-dev' || '' }}
          key: cargo-lambda-${{ env.CARGO_LAMBDA_VERSION }}-zig-${{ env.ZIGLANG_VERSION }}

      - uses: astral-sh/setup-uv@v6

      # Installed at a fixed path rather than run with uvx, which unpacks zig
      # into a new directory each run. Its environment's bin holds python, which
      # cargo-lambda uses to find zig.
      - name: Install cargo-lambda
        run: |
          uv tool install "cargo-lambda==$CARGO_LAMBDA_VERSION" --with "ziglang==$ZIGLANG_VERSION"
          echo "$(uv tool dir)/cargo-lambda/bin" >> "$GITHUB_PATH"

      - name: Apply migrations to the build database
        run: |
          for _ in $(seq 120); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -pgranite --silent 2>/dev/null && break
            sleep 1
          done
          for f in migrations/*.sql; do
            mysql -h 127.0.0.1 -P 3307 -uroot -pgranite granite_local < "$f" \
              || { echo "::error::Migration $f failed"; exit 1; }
          done

      # Dev builds without --release. Its binary is stripped and has no debug
      # info, or it would not fit in a Lambda: as is, the api's is 284 MB and
      # zips to 58 MB, over the 250 MB unzipped and the 50 MB zip that
      # update-function-code takes (stripped: 130 MB, 38 MB). The two variables
      # only change the dev profile, so the release build is untouched.
      - name: Build
        env:
          CARGO_PROFILE_DEV_DEBUG: false
          CARGO_PROFILE_DEV_STRIP: symbols
        run: >-
          cargo lambda build ${{ inputs.environment == 'prod' && '--release' || '' }}
          --x86-64 --output-format zip -p "$APP" --bin "$APP"

      - name: Keep the build
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-${{ inputs.environment }}-${{ env.GIT_SHA }}
          path: target/lambda/${{ inputs.project }}/bootstrap.zip
          retention-days: 7

      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.deploy
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy and verify
        if: inputs.deploy
        run: |
          zip="target/lambda/$APP/bootstrap.zip"
          expected=$(openssl dgst -sha256 -binary "$zip" | base64)
          echo "Package sha256: $expected ($(du -h "$zip" | cut -f1))"
          for function in $FUNCTIONS; do
            echo "::group::$function"
            aws lambda update-function-code --function-name "$function" \
              --zip-file "fileb://$zip" --query '{Sha256:CodeSha256,Status:LastUpdateStatus}'
            aws lambda wait function-updated-v2 --function-name "$function"
            read -r sha status modified < <(aws lambda get-function-configuration \
              --function-name "$function" \
              --query '[CodeSha256,LastUpdateStatus,LastModified]' --output text)
            echo "$function: sha256=$sha status=$status modified=$modified"
            echo "::endgroup::"
            if [ "$sha" != "$expected" ] || [ "$status" != "Successful" ]; then
              echo "::error::$function was not updated to this build"
              exit 1
            fi
            echo "- \`$function\` ← \`$GIT_SHA\` ($BRANCH), sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done
