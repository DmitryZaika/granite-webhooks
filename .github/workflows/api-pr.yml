name: API tests

# Pull requests to main: the api crate's OpenAPI checks (every route
# documented, api/openapi.json current), the Granite Phone integration
# tests and the follow-up tests. The tests make their own databases (test-db) on the MySQL below;
# .cargo/config.toml pins DATABASE_URL to 127.0.0.1:3307/granite_local, where
# common's query! macros check their SQL at compile time, so every migration
# is applied there first, as in deploy-lambda.yml.
#
# On demand from any branch, with optional cargo test arguments in place of the
# fixed suites below:
#   gh workflow run "API tests" --ref <branch> [-f cargo_args="-p api --test it sms_flows::"]
#
# Every integration test file of api is a module of one test binary, `it`
# (api/tests/it.rs); a filter `<file>::` selects one file's tests.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cargo_args:
        description: cargo test arguments (empty runs the PR suites)
        required: false
        default: ''

concurrency:
  group: api-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: api tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: granite
          MYSQL_DATABASE: granite_local
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgranite --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: api-tests

      - name: Apply migrations to the test database
        run: |
          for f in migrations/*.sql; do
            mysql -h 127.0.0.1 -P 3307 -uroot -pgranite granite_local < "$f" \
              || { echo "::error::Migration $f failed"; exit 1; }
          done

      - name: OpenAPI checks
        if: inputs.cargo_args == ''
        run: cargo test -p api --features openapi --test it -- openapi::

      - name: Granite Phone tests
        if: inputs.cargo_args == ''
        run: >-
          cargo test -p api --test it --
          phone_admin::
          phone_auth::
          phone_bootstrap::
          phone_calls::
          phone_contacts::
          phone_devices::
          phone_email_push::
          phone_jobs::
          phone_revocation::
          phone_settings::
          phone_telnyx_dial::
          phone_telnyx_inbound::
          phone_telnyx_outbound::
          phone_telnyx_recording::
          phone_telnyx_via_cell::
          telnyx_10dlc::
          phone_porting::
          telnyx_sms::
          phone_texts::
          phone_web::
          phone_web_recording::
          telnyx_calls::

      - name: Server error reports
        if: inputs.cargo_args == ''
        run: cargo test -p api --test server_errors

      - name: Follow-up tests
        if: inputs.cargo_args == ''
        run: >-
          cargo test -p api --test it --
          followup_flows::
          followup_ai_cadence::
          followup_generation::
          followup_instruction::
          followup_settings::
          sms_flows::

      - name: Requested tests
        if: inputs.cargo_args != ''
        run: cargo test ${{ inputs.cargo_args }}
