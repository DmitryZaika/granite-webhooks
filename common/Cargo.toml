[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
# SES and S3 are signed requests over reqwest (`amazon::sigv4`), not SDK
# crates: the SDK, its runtime and its credential providers were a third of
# the apps' build.
aws-sigv4 = "1.5"
aws-credential-types = "1.3"
aws-smithy-runtime-api = { version = "1.16", features = ["client"] }
bytes = "1"
percent-encoding = "2.3"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# rustls without aws-lc-rs (a C build); `http::client` installs ring instead.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.10"
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
urlencoding = "2.1.3"
serde_urlencoded = "0.7"
regex = "1"
ammonia = "4.2.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"], optional = true }
jpeg-encoder = { version = "0.7", optional = true }
zune-heic = { version = "0.5", optional = true }

[features]
# Reading and re-encoding pictures (`images`): only the apps that store them
# build the decoders.
images = ["dep:image", "dep:jpeg-encoder", "dep:zune-heic"]

[dev-dependencies]
test-db = { path = "../test-db" }
