[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
# No default features: those add a second HTTP/TLS stack (hyper 0.14,
# rustls 0.21) and SigV4a. The HTTPS client is `http::aws_http_client`, on ring.
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso"] }
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-ring"] }
aws-smithy-runtime-api = { version = "1.16", features = ["client"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# rustls without aws-lc-rs (a C build); `http::client` installs ring instead.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.10"
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
urlencoding = "2.1.3"
serde_urlencoded = "0.7"
regex = "1"
ammonia = "4.2.3"


[dev-dependencies]
test-db = { path = "../test-db" }
