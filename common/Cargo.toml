[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-sesv2 = "1"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.10"
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
urlencoding = "2.1.3"
serde_urlencoded = "0.7"
regex = "1"
ammonia = "4.2.3"


[dev-dependencies]
test-db = { path = "../test-db" }
