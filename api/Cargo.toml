[package]
name = "api"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
ammonia = "4.1"
bcrypt = "0.17"
getrandom = "0.3"
common = { path = "../common" }
axum = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.13"
lambda_http = "1.1"
lopdf = { version = "0.45", default-features = false }
miniz_oxide = "0.8"
pdf-writer = "0.15"
percent-encoding = "2.3"
regex = "1"
fancy-regex = "0.19"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
unicode-normalization = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.3.0"
serde_html_form = "0.4.1"
aws-sdk-s3 = { version = "1.127", features = ["behavior-version-latest"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Pure Rust: HEIC photos (iPhone) and PDF pages, no system libraries on Lambda.
zune-heic = "0.5"
hayro = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
hickory-resolver = "0.25"

[dev-dependencies]
test-db = { path = "../test-db" }
axum-test = "19"
