[package]
name = "api-phone"
version = "0.1.0"
edition = "2024"
description = "Granite Phone's routes: the app's API and Telnyx's webhooks."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See the api crate's `openapi` feature.
openapi = ["dep:utoipa", "dep:utoipa-axum", "api-crm/openapi", "api-accounts/openapi"]

[dependencies]
api-crm = { path = "../crm" }
api-accounts = { path = "../accounts" }
getrandom = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
lambda_http = "1.1"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
serde_html_form = "0.4.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
