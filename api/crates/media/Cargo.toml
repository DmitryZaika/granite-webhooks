[package]
name = "api-media"
version = "0.1.0"
edition = "2024"
description = "Pictures and PDFs: thumbnails, phone photos, PDF previews, signing PDFs and their delivery."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See the api crate's `openapi` feature.
openapi = ["dep:utoipa", "dep:utoipa-axum", "api-core/openapi"]

[dependencies]
api-core = { path = "../core" }
ammonia = "4.1"
common = { path = "../../../common", features = ["images"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
lopdf = { version = "0.45", default-features = false }
miniz_oxide = "0.8"
pdf-writer = "0.15"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
unicode-normalization = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
hayro = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
