[package]
name = "api-accounts"
version = "0.1.0"
edition = "2024"
description = "Users and their sessions: sign-in, the signed-in user, the company's users, onboarding."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See the api crate's `openapi` feature.
openapi = ["dep:utoipa", "dep:utoipa-axum", "api-crm/openapi"]

[dependencies]
api-crm = { path = "../crm" }
bcrypt = "0.17"
getrandom = "0.3"
common = { path = "../../../common" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
lambda_http = "1.1"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
