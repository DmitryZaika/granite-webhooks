[package]
name = "api-core"
version = "0.1.0"
edition = "2024"
description = "The api's foundation: AppState and the clients it holds, errors, authentication and the route macros."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See the api crate's `openapi` feature.
openapi = ["dep:utoipa", "dep:utoipa-axum", "api-macros/openapi"]

[dependencies]
getrandom = "0.3"
common = { path = "../../../common" }
axum = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.13"
lambda_http = "1.1"
percent-encoding = "2.3"
regex = "1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors"] }
api-macros = { path = "../../macros" }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
tower-layer = "0.3"
tower-service = "0.3"
serde_html_form = "0.4.1"
aws-credential-types = "1.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
hickory-resolver = "0.25"

[dev-dependencies]
test-db = { path = "../../../test-db" }
