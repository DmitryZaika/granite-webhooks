[package]
name = "api-quotes"
version = "0.1.0"
edition = "2024"
description = "Quotes: pricing, the editor, online quotes and the portal, signatures, QuickBooks, commissions."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See the api crate's `openapi` feature.
openapi = ["dep:utoipa", "dep:utoipa-axum", "api-crm/openapi", "api-schedule/openapi"]

[dependencies]
api-crm = { path = "../crm" }
api-schedule = { path = "../schedule" }
getrandom = "0.3"
common = { path = "../../../common" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hmac = "0.13"
lambda_http = "1.1"
lopdf = { version = "0.45", default-features = false }
percent-encoding = "2.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
