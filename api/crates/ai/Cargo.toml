[package]
name = "api-ai"
version = "0.1.0"
edition = "2024"
description = "AI helpers: the chat assistant, writing and replying, call notes and coaching, kitchen design."

[lib]
# No doc tests; rustdoc would still compile the whole crate looking for them.
doctest = false

[features]
# See the api crate's `openapi` feature.
openapi = ["dep:utoipa", "dep:utoipa-axum", "api-accounts/openapi", "api-inventory/openapi", "api-followups/openapi", "api-quotes/openapi"]

[dependencies]
api-accounts = { path = "../accounts" }
api-inventory = { path = "../inventory" }
api-followups = { path = "../followups" }
api-quotes = { path = "../quotes" }
common = { path = "../../../common" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
lambda_http = "1.1"
regex = "1"
fancy-regex = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "preserve_order", "preserve_path_order"], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
