AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  A granite-manager.com host for a Lambda function URL: certificate, CloudFront
  (no caching, every viewer header but Host) and a DNS record. Used for
  stream.granite-manager.com in front of granite-api-stream. Deploy in us-east-1.

Parameters:
  DomainName:
    Type: String
  FunctionUrlDomain:
    Type: String
    Description: Host of the function URL (xxxx.lambda-url.us-east-2.on.aws).
  OriginReadTimeout:
    Type: Number
    Default: 60
    Description: Seconds CloudFront waits for the next bytes of a response (60 without a quota raise).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z09213062QDJ105YROL3K

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${DomainName}
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: lambda
            DomainName: !Ref FunctionUrlDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: !Ref OriginReadTimeout
        DefaultCacheBehavior:
          TargetOriginId: lambda
          ViewerProtocolPolicy: https-only
          # No Compress: compression would buffer a streamed answer.
          Compress: false
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed AllViewerExceptHostHeader

  Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed zone

Outputs:
  Url:
    Value: !Sub https://${DomainName}
