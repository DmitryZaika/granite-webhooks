[workspace]
members = [
    "common",
    "webhooks",
    "time-triggered",
    "api",
    "api/crates/accounts",
    "api/crates/admin",
    "api/crates/ai",
    "api/crates/core",
    "api/crates/crm",
    "api/crates/followups",
    "api/crates/inventory",
    "api/crates/media",
    "api/crates/phone",
    "api/crates/quotes",
    "api/crates/schedule",
    "api/macros",
    "test-db",
    "test-db/macros",
]
resolver = "2"

# Full debug info made every test binary's .pdb ~1 GB and filled the disk.
# Line tables still give file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Proc macros (serde, sqlx, utoipa) and build scripts, optimized: they run on
# every rebuild of the crates that use them.
[profile.dev.build-override]
opt-level = 3

# Image and PDF decoding are many times slower unoptimized; keep tests fast.
[profile.dev.package.zune-heic]
opt-level = 3

[profile.dev.package.hayro]
opt-level = 3

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
